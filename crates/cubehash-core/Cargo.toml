[package]
name = "cubehash-core"
version = "1.0.2"
edition.workspace = true
license.workspace = true
authors = ["CubeHash Authors"]
description = "General-purpose hierarchical, self-healing, hardware-bound cellular cube cryptography engine"

[dependencies]
blake2 = "0.11"
chacha20poly1305 = "0.11"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
serde.workspace = true
sha2 = "0.11"
sha3 = "0.12"
subtle.workspace = true
thiserror.workspace = true
x25519-dalek = { version = "3.0", features = ["static_secrets", "zeroize"] }
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true
